<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>civick project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your monthly budget smartly</p>
        </header>

        <section class="budget-box">
            <label for="budget">Monthly Budget (₹)</label>
            <div class="budget-input">
                <input type="number" id="budget" placeholder="Enter budget" min="1">
                <button id="saveBudget">Set Budget</button>
            </div>

            <div class="summary">
                <div class="card">
                    <p>Monthly Budget</p>
                    <h2 id="totalBudget">₹0</h2>
                </div>
                <div class="card">
                    <p>Total Spent</p>
                    <h2 id="totalSpent">₹0</h2>
                </div>
                <div class="card">
                    <p>Remaining</p>
                    <h2 id="remaining">₹0</h2>
                </div>
            </div>

            <div class="progress-info">
                <span>Budget Used</span>
                <span id="percentage">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </section>

        <section class="expense-box">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <label for="title">Expense Name</label>
                <input type="text" id="title"
                       placeholder="e.g. Lunch" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount"
                       placeholder="Enter amount" min="0.01"
                       step="0.01" required>

                <label for="category">Category</label>
                <select id="category">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Education</option>
                    <option>Bills</option>
                    <option>Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit" class="add-btn">
                    + Add Expense
                </button>
            </form>
        </section>

        <section class="history-box">
            <h2>Expense History</h2>
            <div id="expenseList"></div>
        </section>

        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
